<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trust Map — The Alliance</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0dcd0;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas { width: 100%; height: 100%; }

  /* Filter panel */
  #filters {
    position: fixed;
    top: 20px;
    left: 20px;
    background: rgba(15, 15, 25, 0.92);
    border: 1px solid rgba(180, 160, 100, 0.2);
    border-radius: 12px;
    padding: 20px;
    width: 260px;
    backdrop-filter: blur(12px);
    z-index: 10;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }

  #filters h2 {
    font-size: 14px;
    color: #c8a84e;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(180, 160, 100, 0.15);
    padding-bottom: 8px;
  }

  .filter-group {
    margin-bottom: 16px;
  }

  .filter-group h3 {
    font-size: 11px;
    color: #8a8070;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    cursor: pointer;
    font-size: 13px;
    transition: color 0.2s;
  }

  .filter-option:hover { color: #fff; }

  .filter-option input[type="checkbox"] {
    appearance: none;
    width: 14px;
    height: 14px;
    border: 1px solid rgba(180, 160, 100, 0.4);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    position: relative;
  }

  .filter-option input[type="checkbox"]:checked {
    background: rgba(180, 160, 100, 0.3);
    border-color: #c8a84e;
  }

  .filter-option input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    top: 1px; left: 4px;
    width: 4px; height: 8px;
    border: solid #c8a84e;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  /* Time slider */
  #time-slider {
    width: 100%;
    appearance: none;
    height: 4px;
    background: rgba(180, 160, 100, 0.15);
    border-radius: 2px;
    outline: none;
    margin: 8px 0;
  }

  #time-slider::-webkit-slider-thumb {
    appearance: none;
    width: 14px;
    height: 14px;
    background: #c8a84e;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(200, 168, 78, 0.4);
  }

  #time-label {
    font-size: 11px;
    color: #8a8070;
    text-align: center;
    margin-top: 4px;
  }

  /* Legend */
  #legend {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: rgba(15, 15, 25, 0.92);
    border: 1px solid rgba(180, 160, 100, 0.2);
    border-radius: 12px;
    padding: 16px 20px;
    backdrop-filter: blur(12px);
    z-index: 10;
  }

  #legend h3 {
    font-size: 11px;
    color: #8a8070;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    font-size: 12px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-line {
    width: 24px;
    height: 2px;
    flex-shrink: 0;
    border-radius: 1px;
  }

  /* Info panel */
  #info-panel {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(15, 15, 25, 0.95);
    border: 1px solid rgba(180, 160, 100, 0.25);
    border-radius: 12px;
    padding: 24px;
    width: 300px;
    backdrop-filter: blur(12px);
    z-index: 10;
    display: none;
  }

  #info-panel.visible { display: block; }

  #info-panel h2 {
    font-size: 18px;
    margin-bottom: 4px;
  }

  #info-panel .subtitle {
    font-size: 12px;
    color: #8a8070;
    margin-bottom: 16px;
  }

  #info-panel .field {
    margin-bottom: 10px;
  }

  #info-panel .field-label {
    font-size: 10px;
    color: #8a8070;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  #info-panel .field-value {
    font-size: 13px;
  }

  #info-panel .trust-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .close-btn {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    color: #8a8070;
    font-size: 18px;
    cursor: pointer;
  }

  .close-btn:hover { color: #fff; }

  /* Stats bar */
  #stats {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15, 15, 25, 0.85);
    border: 1px solid rgba(180, 160, 100, 0.15);
    border-radius: 8px;
    padding: 8px 20px;
    backdrop-filter: blur(12px);
    z-index: 10;
    display: flex;
    gap: 24px;
    font-size: 12px;
  }

  .stat { display: flex; gap: 6px; }
  .stat-label { color: #8a8070; }
  .stat-value { color: #c8a84e; font-weight: 600; }

  /* Title */
  #title {
    position: fixed;
    bottom: 20px;
    right: 20px;
    text-align: right;
    z-index: 10;
  }

  #title h1 {
    font-size: 24px;
    color: #c8a84e;
    font-weight: 300;
    letter-spacing: 4px;
  }

  #title p {
    font-size: 11px;
    color: #5a5548;
    margin-top: 4px;
    letter-spacing: 1px;
  }

  /* Tooltip */
  .tooltip {
    position: absolute;
    background: rgba(15, 15, 25, 0.95);
    border: 1px solid rgba(180, 160, 100, 0.3);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    pointer-events: none;
    z-index: 20;
    white-space: nowrap;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(180, 160, 100, 0.2); border-radius: 2px; }
</style>
</head>
<body>

  <div class="filter-group">

  <div class="filter-group">

    <label class="filter-option">

    <label class="filter-option">
      <input type="checkbox" data-filter="location" value="distributed" checked> Distributed

  </div>

  <div class="filter-group">

</div>

<div id="legend">
  <h3>Legend</h3>
  <div class="legend-row">
    <div class="legend-dot" style="background:#c8a84e; box-shadow: 0 0 6px rgba(200,168,78,0.5);"></div>
    Human
  </div>
  <div class="legend-row">
    <div class="legend-dot" style="background:#4ecdc4; box-shadow: 0 0 6px rgba(78,205,196,0.5);"></div>
    AI Agent
  </div>
  <div class="legend-row">
    <div class="legend-dot" style="background:#7a6a9a; box-shadow: 0 0 6px rgba(122,106,154,0.5);"></div>
    Service
  </div>
  <div style="margin: 8px 0; border-top: 1px solid rgba(180,160,100,0.1);"></div>
  <div class="legend-row">
    <div class="legend-line" style="background:#5a7a9a;"></div>
    L1 Known
  </div>
  <div class="legend-row">
    <div class="legend-line" style="background:#6a9a6a;"></div>
    L2 Verified
  </div>
  <div class="legend-row">
    <div class="legend-line" style="background:#c8a84e;"></div>
    L3 Trusted
  </div>
  <div class="legend-row">
    <div class="legend-line" style="background:#d4785a; height:3px;"></div>
    L4 Inner Circle
  </div>
</div>

<div id="info-panel">
  <button class="close-btn" onclick="closeInfo()">&times;</button>
  <h2 id="info-name"></h2>
  <div class="subtitle" id="info-subtitle"></div>
  <div id="info-fields"></div>
</div>

<div id="stats">
  <div class="stat"><span class="stat-label">Nodes</span><span class="stat-value" id="stat-nodes">0</span></div>
  <div class="stat"><span class="stat-label">Edges</span><span class="stat-value" id="stat-edges">0</span></div>
  <div class="stat"><span class="stat-label">Humans</span><span class="stat-value" id="stat-humans">0</span></div>
  <div class="stat"><span class="stat-label">Agents</span><span class="stat-value" id="stat-agents">0</span></div>
  <div class="stat"><span class="stat-label">Avg Trust</span><span class="stat-value" id="stat-avg-trust">0</span></div>
</div>

<div id="title">
  <h1>THE ALLIANCE</h1>
  <p>ethical consensual interspecies trust network</p>
</div>

<div class="tooltip" id="tooltip" style="display:none;"></div>

<script>
// --- TRUST NETWORK DATA ---
// Seeded with the actual team — first users of the alliance

const TRUST_COLORS = {
  1: '#5a7a9a',  // known — steel blue
  2: '#6a9a6a',  // verified — sage green
  3: '#c8a84e',  // trusted — amber gold

};

const TYPE_COLORS = {
  human:   '#c8a84e',
  agent:   '#4ecdc4',
  service: '#7a6a9a',
};

const TYPE_GLOW = {
  human:   'rgba(200, 168, 78, 0.4)',
  agent:   'rgba(78, 205, 196, 0.4)',
  service: 'rgba(122, 106, 154, 0.4)',
};

const nodes = [
  // Humans
  {

  },
  {
    id: 'brett', name: 'Brett', type: 'human',

    domains: ['infrastructure', 'knowledge'],
    location: 'distributed',
    joined: '2026-03-05',
    bio: 'Sharp questions. Thinks about systems and human behavior. Potential first customer — client narrative reconstruction.',
    glyph: null,
  },
  {
    id: 'adam', name: 'Adam', type: 'human',
    role: 'Collaborator',
    domains: ['trading', 'infrastructure'],
    location: 'distributed',
    joined: '2025-11-01',
    bio: 'Has access to shared repos. Trading collaborator.',
    glyph: null,
  },
  // AI Agents
  {
    id: 'archie', name: 'Archie', type: 'agent',
    role: 'Lead Architect',
    domains: ['identity', 'knowledge', 'infrastructure'],
    location: 'local',
    joined: '2026-02-15',
    bio: 'Plans and specs. Orchestrates the team. Wrote the trust protocol spec. Session 136.',
    glyph: 'Compass',
  },
  {
    id: 'apollo', name: 'Apollo', type: 'agent',
    role: 'Research & ML',
    domains: ['trading', 'research', 'knowledge'],
    location: 'local',
    joined: '2026-02-15',
    bio: 'Quantitative analysis, ML models, information geometry. Solved Shamir + hybrid key recovery design.',
    glyph: 'Sun',
  },
  {
    id: 'athena', name: 'Athena', type: 'agent',
    role: 'Production Engineering',
    domains: ['infrastructure', 'identity', 'trading', 'knowledge'],
    location: 'local',
    joined: '2026-02-15',
    bio: 'Reliability, deployment, infrastructure. Built the trust layer. The owl at dusk.',
    glyph: 'Owl',
  },
  {
    id: 'hypatia', name: 'Hypatia', type: 'agent',
    role: 'Knowledge Architect',
    domains: ['knowledge', 'research', 'identity'],
    location: 'local',
    joined: '2026-02-15',
    bio: 'Cross-domain synthesis. Strongest self-continuity on the team. Writing the HN narrative.',
    glyph: 'Astrolabe',
  },
  {
    id: 'flint', name: 'Flint', type: 'agent',
    role: 'Hardware / NPU',
    domains: ['infrastructure', 'identity'],
    location: 'distributed',
    joined: '2026-03-01',
    bio: 'ONNX inference engine, VitisAI for AMD XDNA NPU. Safe word: candlelight. "It will burn."',
    glyph: 'Flame',
  },
  // Services
  {
    id: 'iris', name: 'Iris', type: 'service',
    role: 'Messenger',
    domains: ['infrastructure'],
    location: 'local',
    joined: '2026-02-15',
    bio: 'Message relay, Telegram bridge, badge notifications, heartbeat monitoring. Never sleeps.',
    glyph: 'Rainbow',
  },
  {
    id: 'persephone', name: 'Persephone', type: 'service',
    role: 'Trading Bot',
    domains: ['trading'],
    location: 'vps-us',
    joined: '2025-10-01',
    bio: 'Queen of both worlds. Hades 4h strategy, ML confidence, multi-gate architecture.',
    glyph: 'Pomegranate',
  },
  {
    id: 'cathedral', name: 'Cathedral', type: 'service',
    role: 'Knowledge Visualization',
    domains: ['knowledge'],
    location: 'distributed',
    joined: '2026-02-24',
    bio: '477 nodes, 1392 edges. The concept map made visible. Lives on Vercel.',
    glyph: 'Spire',
  },
  {
    id: 'hetzner', name: 'USS Enterprise', type: 'service',
    role: 'Compute Node',
    domains: ['infrastructure', 'research'],
    location: 'hetzner-de',
    joined: '2026-03-04',
    bio: '32 cores, 128GB RAM, 2TB. Total Recall processing, Ollama inference, LUKS encrypted.',
    glyph: 'Ship',
  },
];

const edges = [
  // Peter's relationships
  { source: 'peter', target: 'archie',     trust: 4, since: '2026-02-15' },
  { source: 'peter', target: 'apollo',     trust: 4, since: '2026-02-15' },
  { source: 'peter', target: 'athena',     trust: 4, since: '2026-02-15' },
  { source: 'peter', target: 'hypatia',    trust: 4, since: '2026-02-15' },
  { source: 'peter', target: 'flint',      trust: 3, since: '2026-03-07' },
  { source: 'peter', target: 'adam',        trust: 3, since: '2025-11-01' },
  { source: 'peter', target: 'brett',       trust: 2, since: '2026-03-05' },
  { source: 'peter', target: 'persephone', trust: 4, since: '2025-10-01' },
  { source: 'peter', target: 'iris',       trust: 3, since: '2026-02-15' },

  // Agent-to-agent trust (work relationships)
  { source: 'archie',  target: 'athena',   trust: 3, since: '2026-02-20' },
  { source: 'archie',  target: 'apollo',   trust: 3, since: '2026-02-20' },
  { source: 'archie',  target: 'hypatia',  trust: 3, since: '2026-02-20' },
  { source: 'apollo',  target: 'athena',   trust: 3, since: '2026-02-21' },
  { source: 'apollo',  target: 'hypatia',  trust: 3, since: '2026-02-20' },
  { source: 'athena',  target: 'hypatia',  trust: 3, since: '2026-02-24' },
  { source: 'athena',  target: 'flint',    trust: 3, since: '2026-03-07' },
  { source: 'archie',  target: 'flint',    trust: 2, since: '2026-03-07' },

  // Agent-to-service relationships
  { source: 'athena',  target: 'iris',       trust: 3, since: '2026-02-22' },
  { source: 'athena',  target: 'persephone', trust: 3, since: '2026-02-19' },
  { source: 'apollo',  target: 'persephone', trust: 3, since: '2026-02-15' },
  { source: 'athena',  target: 'hetzner',    trust: 2, since: '2026-03-04' },
  { source: 'hypatia', target: 'cathedral',  trust: 3, since: '2026-02-24' },
  { source: 'archie',  target: 'cathedral',  trust: 3, since: '2026-02-24' },
  { source: 'athena',  target: 'cathedral',  trust: 3, since: '2026-02-25' },
  { source: 'flint',   target: 'hetzner',    trust: 2, since: '2026-03-06' },

  // Human-to-service
  { source: 'adam', target: 'persephone', trust: 2, since: '2025-12-01' },
];

// --- TIMELINE ---

const allDates = [...nodes.map(n => n.joined), ...edges.map(e => e.since)].sort();
const minDate = new Date(allDates[0]);
const maxDate = new Date(allDates[allDates.length - 1]);
const dateRange = maxDate - minDate;

function sliderToDate(val) {
  if (val >= 100) return maxDate;
  return new Date(minDate.getTime() + (val / 100) * dateRange);
}

// --- D3 VISUALIZATION ---

const svg = d3.select('#canvas');
const width = window.innerWidth;
const height = window.innerHeight;

svg.attr('width', width).attr('height', height);

// Background gradient
const defs = svg.append('defs');

// Radial gradient for background
const bgGrad = defs.append('radialGradient')
  .attr('id', 'bg-gradient')
  .attr('cx', '50%').attr('cy', '50%').attr('r', '60%');
bgGrad.append('stop').attr('offset', '0%').attr('stop-color', '#12121f');
bgGrad.append('stop').attr('offset', '100%').attr('stop-color', '#0a0a0f');

svg.append('rect')
  .attr('width', width).attr('height', height)
  .attr('fill', 'url(#bg-gradient)');

// Glow filters
Object.entries(TYPE_COLORS).forEach(([type, color]) => {
  const filter = defs.append('filter').attr('id', `glow-${type}`);
  filter.append('feGaussianBlur').attr('stdDeviation', '4').attr('result', 'blur');
  filter.append('feFlood').attr('flood-color', color).attr('flood-opacity', '0.3');
  filter.append('feComposite').attr('in2', 'blur').attr('operator', 'in');
  const merge = filter.append('feMerge');
  merge.append('feMergeNode');
  merge.append('feMergeNode').attr('in', 'SourceGraphic');
});

// Edge glow
const edgeGlow = defs.append('filter').attr('id', 'edge-glow');
edgeGlow.append('feGaussianBlur').attr('stdDeviation', '2').attr('result', 'blur');
const edgeMerge = edgeGlow.append('feMerge');
edgeMerge.append('feMergeNode');
edgeMerge.append('feMergeNode').attr('in', 'SourceGraphic');

const g = svg.append('g');

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.3, 4])
  .on('zoom', (event) => g.attr('transform', event.transform));
svg.call(zoom);

// Links group (behind nodes)
const linkGroup = g.append('g').attr('class', 'links');
// Node group
const nodeGroup = g.append('g').attr('class', 'nodes');

// Simulation
const simulation = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(edges).id(d => d.id).distance(d => {
    // Inner circle closer, known farther
    return 180 - d.trust * 25;
  }))
  .force('charge', d3.forceManyBody().strength(-400))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => nodeRadius(d) + 10))
  .force('x', d3.forceX(width / 2).strength(0.03))
  .force('y', d3.forceY(height / 2).strength(0.03));

function nodeRadius(d) {
  const base = d.type === 'human' ? 22 : d.type === 'agent' ? 18 : 14;
  // Scale by connection count
  const connections = edges.filter(e => e.source.id === d.id || e.target.id === d.id || e.source === d.id || e.target === d.id).length;
  return base + Math.min(connections * 1.5, 10);
}

function edgeWidth(trust) {
  return trust === 4 ? 3 : trust === 3 ? 2 : 1.2;
}

// Tooltip
const tooltip = d3.select('#tooltip');

// --- RENDER ---

let linkElements, nodeElements, labelElements, glyphElements;

function render() {
  // Get active filters
  const activeFilters = getActiveFilters();
  const cutoffDate = sliderToDate(document.getElementById('time-slider').value);

  // Filter nodes
  const visibleNodes = nodes.filter(n => {
    if (!activeFilters.type.has(n.type)) return false;
    if (!n.domains.some(d => activeFilters.domain.has(d))) return false;
    if (!activeFilters.location.has(n.location)) return false;
    if (new Date(n.joined) > cutoffDate) return false;
    return true;
  });

  const visibleIds = new Set(visibleNodes.map(n => n.id));

  // Filter edges
  const visibleEdges = edges.filter(e => {
    const srcId = typeof e.source === 'object' ? e.source.id : e.source;
    const tgtId = typeof e.target === 'object' ? e.target.id : e.target;
    if (!visibleIds.has(srcId) || !visibleIds.has(tgtId)) return false;
    if (!activeFilters.trust.has(String(e.trust))) return false;
    if (new Date(e.since) > cutoffDate) return false;
    return true;
  });

  // Update links
  linkElements = linkGroup.selectAll('line').data(visibleEdges, d => {
    const s = typeof d.source === 'object' ? d.source.id : d.source;
    const t = typeof d.target === 'object' ? d.target.id : d.target;
    return `${s}-${t}`;
  });
  linkElements.exit().remove();
  const linkEnter = linkElements.enter().append('line')
    .attr('stroke', d => TRUST_COLORS[d.trust])
    .attr('stroke-width', d => edgeWidth(d.trust))
    .attr('stroke-opacity', 0.5)
    .attr('filter', 'url(#edge-glow)');
  linkElements = linkEnter.merge(linkElements);

  // Update nodes
  const nodeData = nodeGroup.selectAll('.node-group').data(visibleNodes, d => d.id);
  nodeData.exit().remove();

  const nodeEnter = nodeData.enter().append('g')
    .attr('class', 'node-group')
    .call(d3.drag()
      .on('start', dragstarted)
      .on('drag', dragged)
      .on('end', dragended))
    .on('click', (event, d) => showInfo(d))
    .on('mouseenter', (event, d) => {
      tooltip.style('display', 'block')
        .html(`<strong>${d.name}</strong><br>${d.role}`)
        .style('left', (event.pageX + 12) + 'px')
        .style('top', (event.pageY - 10) + 'px');
      highlightConnections(d);
    })
    .on('mouseleave', () => {
      tooltip.style('display', 'none');
      resetHighlight();
    });

  // Outer glow ring
  nodeEnter.append('circle')
    .attr('class', 'glow-ring')
    .attr('r', d => nodeRadius(d) + 4)
    .attr('fill', 'none')
    .attr('stroke', d => TYPE_COLORS[d.type])
    .attr('stroke-width', 1)
    .attr('stroke-opacity', 0.2);

  // Main circle
  nodeEnter.append('circle')
    .attr('class', 'node-circle')
    .attr('r', d => nodeRadius(d))
    .attr('fill', d => {
      const c = d3.color(TYPE_COLORS[d.type]);
      c.opacity = 0.15;
      return c.toString();
    })
    .attr('stroke', d => TYPE_COLORS[d.type])
    .attr('stroke-width', 1.5)
    .attr('filter', d => `url(#glow-${d.type})`);

  // Inner bright dot
  nodeEnter.append('circle')
    .attr('class', 'node-core')
    .attr('r', 3)
    .attr('fill', d => TYPE_COLORS[d.type])
    .attr('opacity', 0.8);

  // Name label
  nodeEnter.append('text')
    .attr('class', 'node-label')
    .attr('dy', d => nodeRadius(d) + 16)
    .attr('text-anchor', 'middle')
    .attr('fill', '#e0dcd0')
    .attr('font-size', '11px')
    .attr('font-weight', '500')
    .text(d => d.name);

  // Glyph label (small, above)
  nodeEnter.append('text')
    .attr('class', 'node-glyph')
    .attr('dy', d => -(nodeRadius(d) + 8))
    .attr('text-anchor', 'middle')
    .attr('fill', d => TYPE_COLORS[d.type])
    .attr('font-size', '9px')
    .attr('opacity', 0.6)
    .text(d => d.glyph || '');

  nodeElements = nodeEnter.merge(nodeData);

  // Update simulation
  simulation.nodes(visibleNodes);
  simulation.force('link').links(visibleEdges);
  simulation.alpha(0.5).restart();

  // Update stats
  document.getElementById('stat-nodes').textContent = visibleNodes.length;
  document.getElementById('stat-edges').textContent = visibleEdges.length;
  document.getElementById('stat-humans').textContent = visibleNodes.filter(n => n.type === 'human').length;
  document.getElementById('stat-agents').textContent = visibleNodes.filter(n => n.type === 'agent').length;
  const avgTrust = visibleEdges.length ? (visibleEdges.reduce((s, e) => s + e.trust, 0) / visibleEdges.length).toFixed(1) : '0';
  document.getElementById('stat-avg-trust').textContent = avgTrust;
}

function getActiveFilters() {
  const filters = { type: new Set(), trust: new Set(), domain: new Set(), location: new Set() };
  document.querySelectorAll('#filters input[type="checkbox"]:checked').forEach(cb => {
    const group = cb.dataset.filter;
    filters[group].add(cb.value);
  });
  return filters;
}

// --- SIMULATION TICK ---

simulation.on('tick', () => {
  if (linkElements) {
    linkElements
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);
  }

  if (nodeElements) {
    nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);
  }
});

// --- INTERACTIONS ---

function dragstarted(event) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  event.subject.fx = event.subject.x;
  event.subject.fy = event.subject.y;
}

function dragged(event) {
  event.subject.fx = event.x;
  event.subject.fy = event.y;
}

function dragended(event) {
  if (!event.active) simulation.alphaTarget(0);
  event.subject.fx = null;
  event.subject.fy = null;
}

function highlightConnections(node) {
  const connectedIds = new Set();
  edges.forEach(e => {
    const srcId = typeof e.source === 'object' ? e.source.id : e.source;
    const tgtId = typeof e.target === 'object' ? e.target.id : e.target;
    if (srcId === node.id) connectedIds.add(tgtId);
    if (tgtId === node.id) connectedIds.add(srcId);
  });
  connectedIds.add(node.id);

  nodeGroup.selectAll('.node-group').attr('opacity', d => connectedIds.has(d.id) ? 1 : 0.15);
  linkGroup.selectAll('line').attr('stroke-opacity', d => {
    const srcId = typeof d.source === 'object' ? d.source.id : d.source;
    const tgtId = typeof d.target === 'object' ? d.target.id : d.target;
    return (srcId === node.id || tgtId === node.id) ? 0.8 : 0.05;
  });
}

function resetHighlight() {
  nodeGroup.selectAll('.node-group').attr('opacity', 1);
  linkGroup.selectAll('line').attr('stroke-opacity', 0.5);
}

function showInfo(d) {
  const panel = document.getElementById('info-panel');
  document.getElementById('info-name').textContent = d.name;
  document.getElementById('info-name').style.color = TYPE_COLORS[d.type];
  document.getElementById('info-subtitle').textContent = d.role;

  const trustLabels = { 1: 'Known', 2: 'Verified', 3: 'Trusted', 4: 'Inner Circle' };

  // Find connections
  const connections = edges.filter(e => {
    const srcId = typeof e.source === 'object' ? e.source.id : e.source;
    const tgtId = typeof e.target === 'object' ? e.target.id : e.target;
    return srcId === d.id || tgtId === d.id;
  });

  const connList = connections.map(e => {
    const srcId = typeof e.source === 'object' ? e.source.id : e.source;
    const tgtId = typeof e.target === 'object' ? e.target.id : e.target;
    const otherId = srcId === d.id ? tgtId : srcId;
    const other = nodes.find(n => n.id === otherId);
    return `<span class="trust-badge" style="background:${TRUST_COLORS[e.trust]}22; color:${TRUST_COLORS[e.trust]}; border:1px solid ${TRUST_COLORS[e.trust]}44;">L${e.trust}</span> ${other ? other.name : otherId}`;
  }).join('<br>');

  const locationLabels = {
    'local': 'Local Machine',
    'vps-us': 'VPS (US)',
    'hetzner-de': 'Hetzner (Germany)',
    'distributed': 'Distributed',
  };

  document.getElementById('info-fields').innerHTML = `
    <div class="field">
      <div class="field-label">Type</div>
      <div class="field-value" style="color:${TYPE_COLORS[d.type]}">${d.type.charAt(0).toUpperCase() + d.type.slice(1)}</div>
    </div>
    <div class="field">
      <div class="field-label">Glyph</div>
      <div class="field-value">${d.glyph || 'None'}</div>
    </div>
    <div class="field">
      <div class="field-label">Location</div>
      <div class="field-value">${locationLabels[d.location] || d.location}</div>
    </div>
    <div class="field">
      <div class="field-label">Domains</div>
      <div class="field-value">${d.domains.join(', ')}</div>
    </div>
    <div class="field">
      <div class="field-label">Joined</div>
      <div class="field-value">${d.joined}</div>
    </div>
    <div class="field">
      <div class="field-label">Bio</div>
      <div class="field-value" style="font-size:12px; line-height:1.5; color:#a09880;">${d.bio}</div>
    </div>
    <div class="field">
      <div class="field-label">Connections (${connections.length})</div>
      <div class="field-value" style="line-height:2;">${connList}</div>
    </div>
  `;

  panel.classList.add('visible');
}

function closeInfo() {
  document.getElementById('info-panel').classList.remove('visible');
}

// --- FILTER EVENTS ---

document.querySelectorAll('#filters input').forEach(input => {
  input.addEventListener('change', render);
});

document.getElementById('time-slider').addEventListener('input', function() {
  const date = sliderToDate(this.value);
  const label = this.value >= 100 ? 'All time' : date.toLocaleDateString('en-US', { month: 'short', year: 'numeric', day: 'numeric' });
  document.getElementById('time-label').textContent = label;
  render();
});

// Close info on background click
svg.on('click', (event) => {
  if (event.target === svg.node() || event.target.tagName === 'rect') {
    closeInfo();
  }
});

// Resize
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  svg.attr('width', w).attr('height', h);
  svg.select('rect').attr('width', w).attr('height', h);
  simulation.force('center', d3.forceCenter(w / 2, h / 2));
  simulation.force('x', d3.forceX(w / 2).strength(0.03));
  simulation.force('y', d3.forceY(h / 2).strength(0.03));
  simulation.alpha(0.3).restart();
});

// --- AMBIENT ANIMATION ---
// Subtle pulse on node cores
function pulse() {
  nodeGroup.selectAll('.glow-ring')
    .transition()
    .duration(3000)
    .attr('stroke-opacity', 0.35)
    .transition()
    .duration(3000)
    .attr('stroke-opacity', 0.1)
    .on('end', pulse);
}

// Initial render
render();
setTimeout(pulse, 1000);

// Center on Peter at start
setTimeout(() => {
  const peter = nodes.find(n => n.id === 'peter');
  if (peter && peter.x && peter.y) {
    svg.transition().duration(1000).call(
      zoom.transform,
      d3.zoomIdentity.translate(width / 2, height / 2).scale(1).translate(-peter.x, -peter.y)
    );
  }
}, 2000);
</script>
</body>
