# infra/fed-qa/compose.fed-qa.yml — single-box federation QA stack.
# Three svrnty app instances = three sovereign domains + a mailbox-registry TEST-DOUBLE
# + a runner. In-compose networking only (domains resolve as service aliases); for
# browser-level runs also add hosts.fed-qa to /etc/hosts and use the published ports.
# Spec: docs/FEDERATION_QA.md.

services:
  app-a: # the managed "svrnty.is" stand-in
    build:
      context: ../..
      args:
        NEXT_PUBLIC_SVRNTY_DOMAIN: svrnty.is
        NEXT_PUBLIC_SVRNTY_BASE_URL: http://app-a:3000
    image: svrnty-fedqa:app-a
    networks:
      fed:
        aliases: [svrnty.is]
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  app-b: # single-mailbox self-host (cap 1)
    build:
      context: ../..
      args:
        NEXT_PUBLIC_SVRNTY_DOMAIN: relay-b.test
        NEXT_PUBLIC_SVRNTY_BASE_URL: http://app-b:3000
    image: svrnty-fedqa:app-b
    environment:
      RELAY_MAILBOX_CAP: "1"
    networks:
      fed:
        aliases: [relay-b.test]
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  app-c: # multi-mailbox relay
    build:
      context: ../..
      args:
        NEXT_PUBLIC_SVRNTY_DOMAIN: relay-c.test
        NEXT_PUBLIC_SVRNTY_BASE_URL: http://app-c:3000
    image: svrnty-fedqa:app-c
    environment:
      RELAY_MAILBOX_CAP: "1000"
    networks:
      fed:
        aliases: [relay-c.test]
    ports: ["3002:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  registry: # mailbox-registry TEST-DOUBLE — POST /mailbox/register, GET /mailbox/{fp}
    image: node:22-alpine
    working_dir: /work
    volumes: ["./registry-stub.mjs:/work/registry-stub.mjs:ro"]
    command: ["node", "registry-stub.mjs"]
    networks:
      fed:
        aliases: [registry.test]
    ports: ["8100:8100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/mailbox/nope').then(r=>process.exit(r.status===404?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  registry-ttl: # same stub, short TTL — stands in for the satellite's 30-day GC (S8/G3)
    image: node:22-alpine
    working_dir: /work
    volumes: ["./registry-stub.mjs:/work/registry-stub.mjs:ro"]
    command: ["node", "registry-stub.mjs"]
    environment:
      MAILBOX_TTL_MS: "3000"
    networks:
      fed:
        aliases: [registry-ttl.test]
    ports: ["8101:8100"]
    profiles: ["s8"] # only `docker compose --profile s8 up` or `run.sh s8`

  runner:
    image: node:22-bookworm-slim # glibc — can exec the repo's host-built node_modules via tsx
    working_dir: /repo
    volumes: ["../../:/repo"]
    command: ["sh", "-c", "sleep infinity"]
    networks: [fed]
    depends_on: [app-a, app-b, app-c, registry]
    profiles: ["manual"] # exec-driven: `docker compose exec runner node ...`

networks:
  fed:
