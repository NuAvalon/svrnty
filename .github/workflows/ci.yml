name: ci
# svrnty CI status check. The machine-checkable half of the
# merge-gate's "green" condition. Blocking: `next build` must pass
# (catches real import/build breakage = merge-unsafe). Informational: typecheck, until the
# 16-error baseline is drained. NOT YET a REQUIRED check — that needs branch protection,
# which needs repo admin (palberts22 is push+triage only). Org owner enables it; the
# merge-mechanic reads this check meanwhile.
#
# FOLLOW-UP (this week, tracked): add the cross-file divergence-guard test (verify-allowlist
# ≡ apply-allowlist — the lockstep pattern) once BOTH allowlist files land on main via the
# current drain, plus a unified test runner once the extensionless-vs-.ts convention is
# settled. Kept out of the initial check on purpose — a flaky gate is worse than
# a narrow one.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (locked)
        run: npm ci
      - name: Build (Next.js) — BLOCKING
        run: npm run build
      - name: Typecheck — informational (16-error baseline being drained)
        run: npx --no-install tsc --noEmit || true
      - name: Contract guards — lockstep divergence (contact.update verify↔apply allowlist ≡) — BLOCKING
        run: npx --no-install tsx --test src/lib/contacts/contact-update-allowlist-guard.test.ts

  # Playwright e2e against `next dev` — the standing verification path for the demo-critical
  # React flows (contact import, the trust ceremony) that can't be checked in-container otherwise
  # (T11 demo-arc). BLOCKING once specs mature — starts with the harness smoke test.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (locked)
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: e2e — demo-critical flows against next dev
        run: npm run test:e2e

  # Playwright e2e against a PRODUCTION build (`next build` + `next start`) — the ONLY path that can
  # verify beat-3 (guided-Ceremony): React StrictMode double-invoke breaks the joiner mount under
  # `next dev`, so beat-3 is skip-guarded out of the dev `e2e` job above (test.skip(!E2E_PROD)) and
  # exercised HERE instead. ⚠ Because beat-3 runs ONLY here, this job MUST become a REQUIRED check
  # when branch protection lands — a skip in the dev job is not a pass, so without this gating, a
  # beat-3 regression would sail through green (coverage != correctness).
  e2e-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (locked)
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Build (Next.js production) — beat-3 needs a real build
        run: npm run build
      - name: e2e (prod) — demo-arc against next start (beat-3; StrictMode-free)
        env:
          E2E_PROD: '1'
        run: npx playwright test --config=playwright.beat3.config.ts

  # Credential / personal-data scanner over the PR diff — fails only on real credentials
  # or personal data introduced in added lines (test/fixture values and already-public
  # internal naming ride). Fast, no build. NOT YET a REQUIRED check — like the others, that
  # needs branch protection (org-owner enables it); until then it runs + reports red/green
  # on every PR so a risky diff is visible before merge, and can be flipped to required later.
  leak-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the merge-base diff resolves
      - name: Scan PR diff for credentials / personal data
        run: bash .github/scripts/leak-gate.sh "origin/${{ github.base_ref || 'main' }}"
