name: ci
# svrnty CI status check. The machine-checkable half of the
# merge-gate's "green" condition. Blocking: `next build` must pass
# (catches real import/build breakage = merge-unsafe), plus the contract-guard suite,
# both e2e tiers, and the production image build.
#
# Typecheck + lint run as RATCHETS, not informational: they may not grow past the
# baselines in scripts/ci-baseline.json (a check that can only tighten, never loosen
# silently — the previous 16-error informational typecheck quietly grew to 29). Lower
# the baseline in the same PR that drains errors.
#
# NOT YET a REQUIRED check — that needs branch protection, which needs repo admin
# (palberts22 is push+triage only). Org owner enables it; the merge-mechanic reads
# this check meanwhile.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege (same class as qa.yml, Flint ruling #157350): PR-triggered jobs
# check out + run PR-modifiable code, so the GITHUB_TOKEN must NOT fall back to the
# repo default (read/WRITE). No job here needs write (no gh/api/push/comment — the
# docker job builds only, never pushes). A future write-needing job grants it
# narrowly at the job level, never a blanket default.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (locked)
        run: npm ci
      - name: Build (Next.js) — BLOCKING
        run: npm run build
      - name: Typecheck — ratchet (fails if error count grows; lower scripts/ci-baseline.json when draining)
        run: |
          BASE=$(node -p "require('./scripts/ci-baseline.json').tsc_errors")
          npx --no-install tsc --noEmit 2>&1 | tee /tmp/tsc.log | grep -c 'error TS' > /tmp/tsc.count || true
          ACTUAL=$(cat /tmp/tsc.count)
          echo "tsc errors: $ACTUAL (baseline $BASE)"
          if [ "$ACTUAL" -gt "$BASE" ]; then
            echo "::error::tsc errors grew $BASE -> $ACTUAL — fix the new errors or raise the baseline with justification"
            grep 'error TS' /tmp/tsc.log | head -30
            exit 1
          fi
          if [ "$ACTUAL" -lt "$BASE" ]; then
            echo "::notice::tsc errors drained $BASE -> $ACTUAL — lower the baseline in this PR"
          fi
      - name: Lint — ratchet (fails if error count grows)
        run: |
          BASE=$(node -p "require('./scripts/ci-baseline.json').lint_errors")
          npm run lint 2>&1 | tee /tmp/lint.log | grep -c '  Error:' > /tmp/lint.count || true
          ACTUAL=$(cat /tmp/lint.count)
          echo "lint errors: $ACTUAL (baseline $BASE)"
          if [ "$ACTUAL" -gt "$BASE" ]; then
            echo "::error::lint errors grew $BASE -> $ACTUAL — fix the new errors or raise the baseline with justification"
            grep '  Error:' /tmp/lint.log | head -40
            exit 1
          fi
          if [ "$ACTUAL" -lt "$BASE" ]; then
            echo "::notice::lint errors drained $BASE -> $ACTUAL — lower the baseline in this PR"
          fi
      - name: Contract guards — lockstep divergence (contact.update verify↔apply allowlist ≡) — BLOCKING
        run: npx --no-install tsx --test src/lib/contacts/contact-update-allowlist-guard.test.ts
      - name: Contract guards — own-identity vCard never emits tags/blocked — BLOCKING
        run: npx --no-install tsx --test src/lib/contacts/own-vcard.test.ts
      - name: Mint-build guards — next-authority pin + rotation verifier — BLOCKING
        run: npx --no-install tsx --test src/lib/identity/next-authority.test.ts
      - name: Contract guards — canonical identity fingerprint + PSI auth allowlist — BLOCKING
        run: npx --no-install tsx --test src/lib/identity/canonical-fingerprint.test.ts src/lib/identity/identity-card-sign.test.ts src/lib/identity/plaintext-import.test.ts src/lib/identity/blocker-c-failclosed.test.ts src/lib/sync/psi-proxy-body.test.ts src/lib/sync/psi-proxy-empty-body.test.ts src/lib/sync/build-psi-sync-options.test.ts src/lib/sync/know-layer-sync.test.ts src/lib/relay/mailbox-auth.test.ts src/lib/messaging/note-auth.test.ts src/lib/trust/slug-claim.test.ts src/lib/trust/joiner-response.test.ts
      - name: Contract guards — Grow Gate (arrive ≠ Known, strip provenance) — BLOCKING
        run: npx --no-install tsx --test src/lib/trust/grow-gate.test.ts src/lib/identity/issued-codes.test.ts src/lib/trust/disclosed-circle-strip.test.ts src/lib/trust/trust-recipe.test.ts src/lib/trust/contact-edge.test.ts
      - name: Contract guards — QR-scan invite leak-site (INV-5) — BLOCKING
        run: npx --no-install tsx --test src/lib/invite/scanInvite.test.ts src/lib/invite/decodeQrFrame.test.ts src/lib/invite/parseInviteUrl.test.ts
      # Keystone §8 (life-safety): these refute protect-the-person properties — a cry/consent-delta
      # is byte-indistinguishable to a peeling relay, cover cadence is traffic-independent, a burst is
      # unrepresentable, single-cell by construction. Blocking so a future edit can't break a §8
      # invariant with CI staying green (the silent-rot trap — Flint C1, #558/#177). Verified 31/31
      # local under this runner. Hard precondition before the distress emit-path / any present-tense
      # undetectability claim ships.
      - name: Keystone crypto guards — K2/K3 §8 silence invariant (distress + cover cadence, uniform frame, blinded consent-delta) — BLOCKING
        run: npx --no-install tsx --test src/lib/crypto/distress-mark.test.ts src/lib/crypto/distress-cadence.test.ts src/lib/crypto/uniform-frame.test.ts src/lib/crypto/consent-delta.test.ts

  # Playwright e2e against `next dev` — the standing verification path for the demo-critical
  # React flows (contact import, the trust ceremony) that can't be checked in-container otherwise
  # (T11 demo-arc). BLOCKING once specs mature — starts with the harness smoke test.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (locked)
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: e2e — demo-critical flows against next dev
        run: npm run test:e2e

  # Playwright e2e against a PRODUCTION build (`next build` + `next start`) — the ONLY path that can
  # verify beat-3 (guided-Ceremony): React StrictMode double-invoke breaks the joiner mount under
  # `next dev`, so beat-3 is skip-guarded out of the dev `e2e` job above (test.skip(!E2E_PROD)) and
  # exercised HERE instead. ⚠ Because beat-3 runs ONLY here, this job MUST become a REQUIRED check
  # when branch protection lands — a skip in the dev job is not a pass, so without this gating, a
  # beat-3 regression would sail through green (coverage != correctness).
  e2e-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install (locked)
        run: npm ci
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium
      - name: Build (Next.js production) — beat-3 needs a real build
        run: npm run build
      - name: e2e (prod) — demo-arc against next start (beat-3; StrictMode-free)
        env:
          E2E_PROD: '1'
        run: npx playwright test --config=playwright.beat3.config.ts

  # Production image build — the CI half of CD. The Dockerfile is the deployable artifact
  # (self-host compose + Caddy); a broken image must fail the gate even though no deploy
  # secrets live here yet. Passes the same provenance args the deploy pipeline uses so
  # /api/version stamps the real SHA. Actual push/deploy needs a registry + host secrets
  # — wire in a follow-up once Peter provisions them.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image — BLOCKING
        run: |
          docker build \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg GIT_BRANCH="$GITHUB_REF_NAME" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t svrnty-ci .
