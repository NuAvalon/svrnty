# svrnty — self-host compose.
#
#   Default (a full sovereign node): the app + Caddy (automatic HTTPS) + the registration
#     satellite backend — all brought up by `docker compose up`. Relay, vault, contact
#     exchange, PSI discovery, onion-route, and trust-sync run on YOUR domain; the one
#     exception is the global vanity-slug registry (id.example.com/alice), which stays on
#     svrnty.is and degrades gracefully.
#   Relay-only (advanced opt-out): drop the `registration` service for a blind dead-drop —
#     only /api/relay/* survives (the 7 /api/satellite/* routes 502). Not a usable sovereign
#     unit on its own; most self-hosters want the default.
#
# Quick start:
#   cp .env.example .env      # then edit .env
#   docker compose up -d --build
#
# ⚠  NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time — they are passed as
#    build args below, NOT runtime env. If you change your domain, you must REBUILD:
#    `docker compose up -d --build`. (Runtime-only env changes won't reach the client.)

services:
  app:
    build:
      context: .
      args:
        # Client-side, build-time (baked into the browser bundle):
        NEXT_PUBLIC_SVRNTY_DOMAIN: ${NEXT_PUBLIC_SVRNTY_DOMAIN:?set NEXT_PUBLIC_SVRNTY_DOMAIN in .env}
        NEXT_PUBLIC_SVRNTY_BASE_URL: ${NEXT_PUBLIC_SVRNTY_BASE_URL:-}
    image: svrnty:selfhost
    environment:
      # Server-side only (read at runtime — safe as env, never shipped to the browser):
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # The Python crypto backend (the "registration" service). ALL /api/satellite/*
      # routes proxy here — register / bind / onion / route / allowed / trust-psi — so
      # it's REQUIRED for a full sovereign relay (without it
      # those 7 endpoints 502; only the native in-proc /api/relay/* dead-drop survives).
      # Keep the host as "registration" — one slug route hardcodes it (see SELF_HOSTING.md).
      SATELLITE_URL: http://registration:8101
    depends_on:
      - registration
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Caddy obtains + auto-renews a Let's Encrypt cert for this domain.
      SVRNTY_DOMAIN: ${NEXT_PUBLIC_SVRNTY_DOMAIN:?set NEXT_PUBLIC_SVRNTY_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # ── Satellite crypto backend ("registration") — REQUIRED for a sovereign relay ──
  # The converged keystone: the Python crypto backend behind the app's /api/satellite/*
  # proxies. WITHOUT this service all of
  # register / bind / onion / route / allowed / trust-psi return 502 — only the native
  # in-proc /api/relay/* dead-drop survives. A relay-only deployment is a blind dead-drop
  # that can't onboard identities, do PSI mutual-discovery, onion-route, or trust-sync =
  # not a usable sovereign unit. So it runs by DEFAULT (no longer a profile). Builds from
  # ./infra/svrnty (the OSS keystone satellite source). SATELLITE_MODE=full serves the
  # message/onion/psi plane (registry-only would 403 it).
  # The ONE svrnty.is-only exception: /slug/{name}/claim (the GLOBAL username registry) —
  # self-host is fully sovereign EXCEPT global-slug lookup, which graceful-degrades.
  # MUST remain reachable as host "registration" on :8101 (one slug route hardcodes it).
  registration:
    build:
      context: ./infra/svrnty
      dockerfile: Dockerfile
    image: ${REGISTRATION_IMAGE:-svrnty-registration:latest}
    environment:
      SATELLITE_MODE: ${SATELLITE_MODE:-full}
    expose:
      - "8101"
    volumes:
      - registration_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  registration_data:
